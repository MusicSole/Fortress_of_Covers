<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DC Comics – January 1962 Covers</title>
  <style>
    body {
      background-color: #f8f6f2;
      color: #000000;
      font-family: Garamond, serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .cover {
      display: inline-block;
      width: 240px;
      background-color: #ffffff;
      border-radius: 10px;
      padding: 10px;
      margin: 15px;
      text-align: left;
      border: 1px solid #ddd;
      box-shadow: 0 0 0 rgba(0, 0, 0, 0);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .cover:hover {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      transform: translateY(-5px);
    }

    img {
      width: 100%;
      border-radius: 5px;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
    }

    .info {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>DC Comics – January 1962 Covers</h1>
  <div id="covers"></div>

  <script>
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShO167Fos9NuSDUJhZAdgPRLoq2n99AAgBvVvJkDr0bgcOcljSFPR9Yl0C4_y_tmJU_EXkcITLrHWm/pub?output=csv';

    fetch(sheetURL)
      .then(response => response.text())
      .then(data => {
        const rows = data.split('\n').slice(1);
        const container = document.getElementById('covers');

        rows.forEach(row => {
          const cols = row.split(',');

          const rawMonth = cols[0]?.trim();
          const rawYear = cols[1]?.trim();
          const title = cols[2]?.trim();
          const issue = cols[3]?.trim();
          const artist = cols[4]?.trim();
          const writer = cols[5]?.trim();
          const notes = cols[6]?.trim();
          const publisher = cols[7]?.trim().toLowerCase(); // "dc" or "marvel"
          const imageFile = cols[8]?.trim();

          const month = rawMonth?.toLowerCase();
          const year = rawYear;
          const shortMonth = rawMonth?.slice(0, 3).toLowerCase();

          // Filter: only show DC comics from January 1962
          if (publisher === 'dc' && rawMonth.toLowerCase() === 'january' && rawYear === '1962') {
            const folder = `${publisher}_${year}_covers/${publisher}_${shortMonth}_${year}/`;
            const imageUrl = `https://musicsole.github.io/Fortress_of_Covers/${folder}${imageFile}`;

            const cover = document.createElement('div');
            cover.className = 'cover';

            cover.innerHTML = `
              <img src="${imageUrl}" alt="${title} Cover" />
              <div class="title">${title}</div>
              <div class="info">Issue: ${issue}</div>
              <div class="info">Artist: ${artist}</div>
              <div class="info">Writer: ${writer}</div>
              <div class="info">Notes: ${notes}</div>
            `;

            container.appendChild(cover);
          }
        });
      });
  </script>
</body>
</html>
