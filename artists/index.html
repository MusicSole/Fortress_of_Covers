<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Artists Index</title>
</head>
<body>
  <h1>Artists</h1>
  <ul id="artist-list"></ul>

  <script>
    const artists = [
      'curt_swan',
      'jack_kirby',
      'john_romita',
      'steve_ditko',
      'gil_kane'
    ];

    const list = document.getElementById('artist-list');

    artists.forEach(name => {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = `/Fortress_of_Covers/artists/${name}.html`;
      link.textContent = name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      item.appendChild(link);
      list.appendChild(item);
    });
  </script>
</body>
</html>
