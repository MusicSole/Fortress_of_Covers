<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Action Comics – Comic Covers</title>
  <style>
    body {
      background-color: #f8f6f2;
      color: #000000;
      font-family: Garamond, serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .cover {
      display: inline-block;
      width: 240px;
      background-color: #ffffff;
      border-radius: 10px;
      padding: 10px;
      margin: 15px;
      text-align: left;
      box-shadow: 0 0 0 rgba(0, 0, 0, 0);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      border: 1px solid #ddd;
    }

    .cover:hover {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transform: scale(1.02);
    }

    img {
      max-width: 100%;
      border-radius: 5px;
    }

    .title {
      font-weight: bold;
      margin-top: 10px;
    }

    .info {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Action Comics – Cover Gallery</h1>
  <div id="covers"></div>

  <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShO167Fos9NuSDUJhZAdgPRLoq2n99AAgBvVvJkDr0bgcOcljSFPR9Yl0C4_y_tmJU_EXkcITLrHWm/pub?output=csv';

    fetch(sheetUrl)
      .then(response => response.text())
      .then(data => {
        const rows = data.trim().split('\n').slice(1); // Skip header
        const container = document.getElementById('covers');

        rows.forEach(row => {
          const cols = row.split(',');

          const title = cols[2]?.trim().toLowerCase().replace(/"/g, '');
          if (title !== 'action comics') return;

          const issue = cols[3]?.trim().replace(/"/g, '');
          const month = cols[0]?.trim().replace(/"/g, '');
          const year = cols[1]?.trim().replace(/"/g, '');
          const imageUrl = cols[8]?.trim().replace(/"/g, '');

          const coverDiv = document.createElement('div');
          coverDiv.className = 'cover';

          const img = document.createElement('img');
          img.src = imageUrl;
          img.alt = `${title} #${issue}`;

          const titleDiv = document.createElement('div');
          titleDiv.className = 'title';
          titleDiv.textContent = `${title.charAt(0).toUpperCase() + title.slice(1)} #${issue}`;

          const infoDiv = document.createElement('div');
          infoDiv.className = 'info';
          infoDiv.textContent = `${month} ${year}`;

          coverDiv.appendChild(img);
          coverDiv.appendChild(titleDiv);
          coverDiv.appendChild(infoDiv);
          container.appendChild(coverDiv);
        });
      })
      .catch(error => {
        console.error('Error loading covers:', error);
      });
  </script>
</body>
</html>
