<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Green Lantern</title>
  <style>
    body {
      background-color: #f8f6f2;
      color: #000000;
      font-family: Garamond, serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
    }
    .cover {
      display: inline-block;
      width: 240px;
      background-color: #ffffff;
      border-radius: 10px;
      padding: 10px;
      margin: 15px;
      text-align: left;
      border: 1px solid #ddd;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }
    .cover:hover {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transform: scale(1.03);
    }
  </style>
</head>
<body>
  <h1>Green Lantern</h1>
  <div id="coverContainer"></div>

  <script>
    fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vShO167Fos9NuSDUJhZAdgPRLoq2n99AAgBvVvJkDr0bgcOcljSFPR9Yl0C4_y_tmJU_EXkcITLrHWm/pub?output=csv')
      .then(response => response.text())
      .then(data => {
        const rows = data.trim().split('\n').slice(1);
        const container = document.getElementById('coverContainer');

        rows.forEach(row => {
          const cols = row.split(',');
          const title = cols[2]?.trim();
          if (title.toLowerCase() === 'green lantern') {
            const issue = cols[3]?.trim();
            const penciler = cols[4]?.trim();
            const inker = cols[5]?.trim();
            const grade = cols[6]?.trim();
            const imageURL = cols[8]?.trim();

            const div = document.createElement('div');
            div.className = 'cover';
            div.innerHTML = `
              <img src="${imageURL}" alt="${title}" style="width:100%">
              <p>
                <strong>${title}</strong><br>
                Issue: ${issue}<br>
                Pencils: <a href="/Fortress_of_Covers/artists/${penciler.toLowerCase().replaceAll(' ', '_')}.html">${penciler}</a><br>
                Inks: ${inker}<br>
                Grade: ${grade}
              </p>
            `;
            container.appendChild(div);
          }
        });
      });
  </script>
</body>
</html>
