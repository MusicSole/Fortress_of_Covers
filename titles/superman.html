<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Superman – Fortress of Covers</title>
  <style>
    body {
      background-color: #f8f6f2;
      color: #000000;
      font-family: Garamond, serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .cover {
      display: inline-block;
      width: 240px;
      background-color: #ffffff;
      border-radius: 10px;
      padding: 10px;
      margin: 15px;
      text-align: left;
      box-shadow: 0 0 0 rgba(0, 0, 0, 0);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      border: 1px solid #ddd;
    }

    .cover:hover {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transform: scale(1.03);
    }

    img {
      width: 100%;
      border-radius: 5px;
    }

    .info {
      margin-top: 10px;
      font-size: 0.9em;
    }

    .info a {
      color: #004aad;
      text-decoration: none;
    }

    .info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Superman Covers</h1>
  <div id="covers">Loading...</div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShO167Fos9NuSDUJhZAdgPRLoq2n99AAgBvVvJkDr0bgcOcljSFPR9Yl0C4_y_tmJU_EXkcITLrHWm/pub?output=csv';
    const titleName = 'superman'; // match lowercase form of title

    fetch(SHEET_URL)
      .then(response => response.text())
      .then(csv => {
        const parsed = Papa.parse(csv, { header: true });
        const rows = parsed.data;
        const container = document.getElementById('covers');
        container.innerHTML = '';

        rows.forEach(row => {
          const rawTitle = row['Title']?.trim().replace(/^"|"$/g, '');
          const title = rawTitle?.toLowerCase();
          if (title !== titleName) return;

          const month = row['Month']?.trim();
          const year = row['Year']?.trim();
          const issue = row['Issue']?.trim();
          const pencils = row['Pencils']?.trim() || '—';
          const publisher = row['Publisher']?.trim().toLowerCase();
          const imageFile = row['Image']?.trim().replace(/^"|"$/g, '');
          if (!imageFile) return;

          const shortMonth = month.toLowerCase().slice(0, 3);
          const folder = `${publisher}_${year}_covers/${publisher}_${shortMonth}_${year}`;
          const imageUrl = `https://musicsole.github.io/Fortress_of_Covers/${folder}/${imageFile}`;

          const artistSlug = pencils.toLowerCase().replace(/\s+/g, '_').replace(/[^\w_]/g, '');

          const div = document.createElement('div');
          div.className = 'cover';

          div.innerHTML = `
            <img src="${imageUrl}" alt="${rawTitle} #${issue}" onerror="this.style.display='none'">
            <div class="info">
              <strong>${rawTitle.toUpperCase()} #${issue}</strong><br>
              ${month} ${year}<br>
              <a href="/Fortress_of_Covers/artists/${artistSlug}.html">${pencils}</a>
            </div>
          `;

          container.appendChild(div);
        });
      })
      .catch(error => {
        document.getElementById('covers').innerText = 'Failed to load covers.';
        console.error(error);
      });
  </script>
</body>
</html>
