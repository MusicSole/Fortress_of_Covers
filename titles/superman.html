<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Superman – Fortress of Covers</title>
  <style>
    body {
      background-color: #f8f6f2;
      color: #000000;
      font-family: Garamond, serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .cover {
      display: inline-block;
      width: 240px;
      background-color: #ffffff;
      border-radius: 10px;
      padding: 10px;
      margin: 15px;
      text-align: left;
      box-shadow: 0 0 0 rgba(0, 0, 0, 0);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      border: 1px solid #ddd;
    }

    .cover:hover {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transform: scale(1.03);
    }

    img {
      width: 100%;
      border-radius: 5px;
    }

    .info {
      margin-top: 10px;
      font-size: 0.9em;
    }

    .info a {
      color: #004aad;
      text-decoration: none;
    }

    .info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Superman Covers</h1>
  <div id="covers"></div>

  <script>
    const titleName = 'superman'; // <-- change for each title page

    fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vShO167Fos9NuSDUJhZAdgPRLoq2n99AAgBvVvJkDr0bgcOcljSFPR9Yl0C4_y_tmJU_EXkcITLrHWm/pub?output=csv')
      .then(response => response.text())
      .then(csv => {
        const rows = csv.split('\n').slice(1); // skip header
        const container = document.getElementById('covers');

        rows.forEach(row => {
          const cols = row.split(',');

          const title = cols[2]?.trim().toLowerCase();
          if (title !== titleName) return;

          const publisher = cols[7]?.trim().toLowerCase();
          const month = cols[0]?.trim().toLowerCase();
          const year = cols[1]?.trim();
          const shortMonth = month.slice(0, 3);
          const imageFile = cols[8]?.trim();
          const issue = cols[3]?.trim();
          const artist = cols[4]?.trim();
          const artistSlug = artist.toLowerCase().replace(/ /g, '_');

          const folder = `${publisher}_${year}_covers/${publisher}_${shortMonth}_${year}`;
          const imgUrl = `https://musicsole.github.io/Fortress_of_Covers/${folder}/${imageFile}`;

          const div = document.createElement('div');
          div.className = 'cover';

          div.innerHTML = `
            <img src="${imgUrl}" alt="${title} ${issue}">
            <div class="info">
              <strong>${titleName.replace(/_/g, ' ').toUpperCase()} #${issue}</strong><br>
              ${month} ${year}<br>
              <a href="/Fortress_of_Covers/artists/${artistSlug}.html">${artist}</a>
            </div>
          `;

          container.appendChild(div);
        });
      });
  </script>
</body>
</html>
