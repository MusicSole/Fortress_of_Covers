<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Comic Titles Index – Fortress of Covers</title>
  <style>
    body {
      background-color: #f8f6f2;
      color: #000000;
      font-family: Garamond, serif;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    ul {
      max-width: 600px;
      margin: auto;
      padding: 0;
      list-style: none;
    }

    li {
      margin: 10px 0;
      font-size: 18px;
    }

    a {
      color: #004aad;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Browse by Title</h1>
  <ul id="title-list"></ul>

  <script>
    const titles = [
      'action_comics',
      'amazing_fantasy',
      'avengers',
      'batman',
      'captain_america',
      'detective_comics',
      'fantastic_four',
      'green_lantern',
      'hulk',
      'iron_man',
      'justice_league',
      'spider_man',
      'superman',
      'thor',
      'wonder_woman'
      // Add more as you go
    ];

    const list = document.getElementById('title-list');

    titles.forEach(title => {
      const li = document.createElement('li');
      const link = document.createElement('a');
      link.href = `${title}.html`;
      link.textContent = title.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      li.appendChild(link);
      list.appendChild(li);
    });
  </script>
</body>
</html>
