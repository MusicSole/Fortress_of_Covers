<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Batman – Fortress of Covers</title>
  <style>
    body {
      background-color: #f8f6f2;
      color: #000000;
      font-family: Garamond, serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .cover {
      display: inline-block;
      width: 240px;
      background-color: #ffffff;
      border-radius: 10px;
      padding: 10px;
      margin: 15px;
      text-align: left;
      box-shadow: 0 0 0 rgba(0, 0, 0, 0);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      border: 1px solid #ddd;
    }

    .cover:hover {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transform: scale(1.03);
    }

    img {
      width: 100%;
      border-radius: 5px;
    }

    .info {
      margin-top: 10px;
      font-size: 0.9em;
    }

    .info a {
      color: #004aad;
      text-decoration: none;
    }

    .info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Batman Covers</h1>
  <div id="covers">Loading...</div>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShO167Fos9NuSDUJhZAdgPRLoq2n99AAgBvVvJkDr0bgcOcljSFPR9Yl0C4_y_tmJU_EXkcITLrHWm/pub?output=csv';
    const titleName = 'batman'; // this must match column C exactly (lowercase)

    fetch(SHEET_URL)
      .then(response => response.text())
      .then(data => {
        const rows = data.split('\n').slice(1);
        const container = document.getElementById('covers');
        container.innerHTML = '';

        rows.forEach(row => {
          const cols = row.split(',');

          const title = cols[2]?.trim().toLowerCase();
          if (title !== titleName) return;

          const month = cols[0]?.trim();
          const year = cols[1]?.trim();
          const issue = cols[3]?.trim();
          const pencils = cols[4]?.trim();
          const publisher = cols[7]?.trim().toLowerCase();
          const imageFile = cols[8]?.trim();

          const shortMonth = month.toLowerCase().slice(0, 3);
          const folder = `${publisher}_${year}_covers/${publisher}_${shortMonth}_${year}`;
          const imageUrl = `https://musicsole.github.io/Fortress_of_Covers/${folder}/${imageFile}`;

          const artistSlug = pencils.toLowerCase().replace(/\s+/g, '_').replace(/[^\w_]/g, '');

          const div = document.createElement('div');
          div.className = 'cover';

          div.innerHTML = `
            <img src="${imageUrl}" alt="${titleName} ${issue}">
            <div class="info">
              <strong>${titleName.replace(/_/g, ' ').toUpperCase()} #${issue}</strong><br>
              ${month} ${year}<br>
              <a href="/Fortress_of_Covers/artists/${artistSlug}.html">${pencils}</a>
            </div>
          `;

          container.appendChild(div);
        });
      })
      .catch(error => {
        document.getElementById('covers').innerText = 'Failed to load covers.';
        console.error(error);
      });
  </script>
</body>
</html>
