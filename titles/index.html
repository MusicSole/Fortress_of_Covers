<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Comic Titles – Fortress of Covers</title>
  <style>
    body {
      background-color: #f8f6f2;
      color: #000000;
      font-family: Garamond, serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
    }
    .title-link {
      display: block;
      margin-bottom: 12px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Comic Titles</h1>
  <div id="titles-container">Loading titles...</div>

  <script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShO167Fos9NuSDUJhZAdgPRLoq2n99AAgBvVvJkDr0bgcOcljSFPR9Yl0C4_y_tmJU_EXkcITLrHWm/pub?output=csv';

    function sanitizeTitle(title) {
      return title
        .toLowerCase()
        .replace(/[^a-z0-9 ]/g, '')  // remove punctuation
        .replace(/\s+/g, '_');       // replace spaces with underscores
    }

    fetch(csvUrl)
      .then(response => response.text())
      .then(data => {
        const rows = data.split('\n').slice(1); // skip header
        const container = document.getElementById('titles-container');
        container.innerHTML = ''; // clear "Loading" text

        const seen = new Set(); // avoid duplicates

        rows.forEach(row => {
          const columns = row.split(',');
          if (columns.length > 2) {
            const rawTitle = columns[2].trim();
            if (!seen.has(rawTitle) && rawTitle) {
              seen.add(rawTitle);
              const sanitized = sanitizeTitle(rawTitle);
              const link = document.createElement('a');
              link.href = `/Fortress_of_Covers/titles/${sanitized}.html`;
              link.className = 'title-link';
              link.textContent = rawTitle;
              container.appendChild(link);
            }
          }
        });
      });
  </script>
</body>
</html>
