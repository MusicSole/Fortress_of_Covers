<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comic Titles Index</title>
  <style>
    body {
      background-color: #f8f6f2;
      color: #000;
      font-family: Garamond, serif;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    ul {
      list-style: none;
      padding: 0;
      max-width: 600px;
      margin: auto;
    }

    li {
      margin: 10px 0;
      font-size: 18px;
    }

    a {
      color: #003366;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>All Comic Titles</h1>
  <ul id="titleList">
    <li>Loading titles...</li>
  </ul>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShO167Fos9NuSDUJhZAdgPRLoq2n99AAgBvVvJkDr0bgcOcljSFPR9Yl0C4_y_tmJU_EXkcITLrHWm/pub?output=csv';

    fetch(SHEET_URL)
      .then(response => response.text())
      .then(data => {
        const rows = data.split('\n').slice(1); // skip header
        const titles = new Set();

        rows.forEach(row => {
          const cols = row.split(',');
          const title = cols[2]?.trim();
          if (title) titles.add(title);
        });

        const sortedTitles = Array.from(titles).sort((a, b) => a.localeCompare(b));
        const ul = document.getElementById('titleList');
        ul.innerHTML = '';

        sortedTitles.forEach(title => {
          const filename = title.toLowerCase().replaceAll(' ', '_').replace(/[^\w_]/g, '') + '.html';
          const li = document.createElement('li');
          li.innerHTML = `<a href="/Fortress_of_Covers/titles/${filename}">${title}</a>`;
          ul.appendChild(li);
        });
      })
      .catch(error => {
        console.error('Error loading CSV:', error);
        document.getElementById('titleList').innerHTML = '<li>Failed to load titles.</li>';
      });
  </script>
</body>
</html>
