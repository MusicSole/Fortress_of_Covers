<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Comic Titles Index</title>
  <style>
    body {
      background-color: #f8f6f2;
      color: #000;
      font-family: Garamond, serif;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    ul {
      list-style: none;
      padding: 0;
      max-width: 600px;
      margin: auto;
    }

    li {
      margin: 10px 0;
      font-size: 18px;
    }

    a {
      color: #003366;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>All Comic Titles</h1>
  <ul id="titleList">
    <li>Loading titles...</li>
  </ul>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShO167Fos9NuSDUJhZAdgPRLoq2n99AAgBvVvJkDr0bgcOcljSFPR9Yl0C4_y_tmJU_EXkcITLrHWm/pub?output=csv';

    fetch(SHEET_URL)
      .then(res => res.text())
      .then(csv => {
        const lines = csv.trim().split('\n').slice(1); // skip header
        const titlesSet = new Set();

        for (let line of lines) {
          const cols = line.split(',');
          const title = cols[2]?.trim(); // Column C
          if (title) titlesSet.add(title);
        }

        const sortedTitles = Array.from(titlesSet).sort();
        const ul = document.getElementById('titleList');
        ul.innerHTML = '';

        sortedTitles.forEach(title => {
          const safeFile = title
            .toLowerCase()
            .replace(/\s+/g, '_')
            .replace(/[^\w_]/g, ''); // Only keep letters, numbers, _
          const li = document.createElement('li');
          li.innerHTML = `<a href="/Fortress_of_Covers/titles/${safeFile}.html">${title}</a>`;
          ul.appendChild(li);
        });

        if (sortedTitles.length === 0) {
          ul.innerHTML = '<li>No titles found.</li>';
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('titleList').innerHTML = '<li>Error loading titles.</li>';
      });
  </script>
</body>
</html>
