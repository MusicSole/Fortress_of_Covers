<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Titles Index</title>
</head>
<body>
<h1>Titles</h1>
<ul id="title-list"></ul>

<script>
const titles = [
journey_into_mystery',
green_lantern',
batman',
showcase',
detective_comics'
];

const list = document.getElementById('title-list');

titles.forEach(name => {
const item = document.createElement('li');
const link = document.createElement('a');
link.href = `/Fortress_of_Covers/titles/${title}.html`;
link.textContent = name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
item.appendChild(link);
list.appendChild(item);
});
</script>
</body>
</html>
